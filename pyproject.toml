[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "slack-codex-bridge"
version = "0.1.0"
description = "Socket Mode Slack bridge for one-shot Codex CLI tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "slack-bolt>=1.20.1,<2.0.0",
]

[project.scripts]
slack-codex-bridge = "slack_codex_bridge.app:main"

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pytest>=8.0.0,<9.0.0",
  "pytest-cov>=7.0.0",
]
